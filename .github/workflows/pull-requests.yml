name: PR helper

# 1. Copies the level label from the linked issue onto the PR (the leaderboard scores PRs by that label).
# 2. Checks Level 1 PRs (a single new contributors/<username>.json) and merges them when they are valid.
#
# SECURITY: pull_request_target runs with write access, even for PRs from forks.
# This workflow must NEVER check out or run code from the PR. It only reads files through the API, as data.
on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: write # merge Level 1 PRs
  pull-requests: write
  issues: write # labels and comments
  actions: write # redeploy the site after a merge

concurrency:
  group: pr-helper-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;
            const { owner, repo } = context.repo;
            const site = `https://${owner.toLowerCase()}.github.io/${repo}/`;

            // ---------- 1. Level label from the linked issue ----------
            const linked = [...(pr.body || "").matchAll(/\b(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/gi)].map((m) => Number(m[1]));
            const levels = [];
            for (const number of linked) {
              try {
                const { data: issue } = await github.rest.issues.get({ owner, repo, issue_number: number });
                for (const l of issue.labels) {
                  const m = /^level-([2-4])$/.exec(typeof l === "string" ? l : l.name);
                  if (m) levels.push(Number(m[1]));
                }
              } catch {} // the issue may not exist
            }
            if (levels.length) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: [`level-${Math.max(...levels)}`] });
            }

            // ---------- 2. Level 1 check ----------
            const files = await github.paginate(github.rest.pulls.listFiles, { owner, repo, pull_number: pr.number });
            if (!files.some((f) => f.filename.startsWith("contributors/"))) {
              return core.info("Not a contributor-file PR. Left for a human review.");
            }

            const MARK = "<!-- level-1-check -->";
            async function say(text) {
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: pr.number });
              const old = comments.find((c) => c.user.type === "Bot" && c.body.includes(MARK));
              const body = `${MARK}\n${text}`;
              if (old) await github.rest.issues.updateComment({ owner, repo, comment_id: old.id, body });
              else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            }

            const expected = `contributors/${author.toLowerCase()}.json`;
            const file = files.find((f) => f.filename.toLowerCase() === expected);

            // A file already on main is an edit even when GitHub calls it "added"
            // (that happens when the PR comes from a fork that's behind main).
            let onBase = false;
            if (file) {
              try {
                await github.rest.repos.getContent({ owner, repo, path: file.filename, ref: pr.base.ref });
                onBase = true;
              } catch {} // 404: genuinely new
            }

            // Editing an existing file (for example adding "graduated" at Level 5) needs a human.
            if (file && (file.status !== "added" || onBase) && files.length === 1) {
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["needs-review"] });
              return say(`Thanks @${author}! Changes to an existing contributor file are checked by a maintainer, usually within 48 hours.`);
            }

            const problems = [];
            if (files.length !== 1) {
              problems.push(`Change exactly one file: your own \`contributors/${author}.json\`. This PR changes ${files.length} files.`);
            }
            if (!file) {
              problems.push(`Name your file \`contributors/${author}.json\`, using your GitHub username exactly.`);
            }

            let data;
            if (file && pr.head.repo) {
              const { data: blob } = await github.rest.repos.getContent({
                owner: pr.head.repo.owner.login,
                repo: pr.head.repo.name,
                path: file.filename,
                ref: pr.head.sha,
              });
              if (blob.size > 2000) {
                problems.push("The file is too big. It should only be a few short lines.");
              } else {
                try {
                  data = JSON.parse(Buffer.from(blob.content, "base64").toString("utf8"));
                } catch (e) {
                  problems.push(`The file isn't valid JSON (${e.message}). Check for a missing quote, comma or brace.`);
                }
              }
            }

            if (data !== undefined) {
              if (typeof data !== "object" || data === null || Array.isArray(data)) {
                problems.push("The file should be one `{ ... }` object, like `contributors/_example.json`.");
              } else {
                const allowed = ["name", "github", "year", "note"];
                const extra = Object.keys(data).filter((k) => !allowed.includes(k));
                if (extra.length) problems.push(`Remove these fields: ${extra.map((k) => `\`${k}\``).join(", ")}. Allowed fields: name, github, year, note.`);
                if (typeof data.name !== "string" || !data.name.trim() || data.name.length > 60) problems.push("`name` should be your name, up to 60 characters.");
                if (typeof data.github !== "string" || data.github.toLowerCase() !== author.toLowerCase()) problems.push(`\`github\` should be exactly \`"${author}"\`.`);
                if (data.year !== undefined && ![1, 2, 3, 4].includes(data.year)) problems.push("`year` should be a number from 1 to 4, without quotes, like `\"year\": 2`.");
                if (data.note !== undefined && (typeof data.note !== "string" || data.note.length > 100)) problems.push("`note` should be one line of text, up to 100 characters.");
              }
            }

            if (problems.length) {
              await say([
                `Hey @${author}, almost there! Fix these and push again. This check reruns by itself:`,
                "",
                ...problems.map((p) => `- ${p}`),
                "",
                `Stuck? The [first PR guide](${site}#first-pr) has a form that writes the file for you.`,
              ].join("\n"));
              return core.setFailed(`${problems.length} problem(s) with the contributor file.`);
            }

            // Valid: label, merge, then redeploy so the new polaroid shows up right away.
            await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["level-1"] });
            try {
              await github.rest.pulls.merge({ owner, repo, pull_number: pr.number, merge_method: "squash", sha: pr.head.sha });
            } catch (e) {
              // e.g. branch protection requires an approval
              await github.rest.issues.addLabels({ owner, repo, issue_number: pr.number, labels: ["needs-review"] });
              return say(`Your file looks perfect, @${author}! A maintainer just needs to click merge, usually within 48 hours.`);
            }
            await say([
              `Welcome to Open Source BYTE 2K26, @${author}! ✱`,
              "",
              "Your file checks out, so I've merged it. That's your first open source pull request.",
              `Your polaroid will be on [the contributors wall](${site}#contributors) in a few minutes.`,
              "",
              `**Next stop: Level 2.** Pick an issue labelled \`level-2\` and comment \`/assign\` to claim it.`,
            ].join("\n"));
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: "deploy.yml", ref: pr.base.ref });
